name: Synthetic checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests (synthetic data only)
        run: python -m unittest discover -s tests -v
      - name: Validate released catalog and App bundle
        run: python tooling/validate_catalog.py
      - name: Reject canonical schema and catalog bundle drift
        run: python tooling/sync_manager_bundle.py --check
      - name: Scan committed history for forbidden content
        run: python tooling/check_secrets.py --history --no-private-values

  app-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.13'
      - name: Check committed App build context
        run: python tooling/sync_manager_bundle.py --check
      - name: Build deterministic device-free runtime fixtures
        run: >-
          python tooling/build_fixture.py
          --output-dir "$RUNNER_TEMP/hahapent-fixtures"
          --revision "$GITHUB_SHA"
          --release-tag test-fixtures-v1
      - name: Build actual amd64 App image
        run: docker build --platform linux/amd64 --tag hahapent-runtime:ci manager
      - name: Run actual HTTP server and negative authorization smoke without network
        run: >-
          docker run --rm --network none --platform linux/amd64
          --mount "type=bind,src=$GITHUB_WORKSPACE/tests/runtime,dst=/checks,readonly"
          --entrypoint python hahapent-runtime:ci /checks/image_smoke.py
      - name: Run installed engine lifecycle and persistence without network
        run: >-
          docker run --rm --network none --platform linux/amd64
          --mount "type=bind,src=$GITHUB_WORKSPACE/tests/runtime,dst=/checks,readonly"
          --mount "type=bind,src=$RUNNER_TEMP/hahapent-fixtures,dst=/fixtures,readonly"
          --entrypoint python hahapent-runtime:ci /checks/engine_smoke.py
