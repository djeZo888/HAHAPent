name: Synthetic checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests (synthetic data only)
        run: python -m unittest discover -s tests -v
      - name: Validate draft catalog
        run: python tooling/validate_catalog.py
      - name: Scan committed history for forbidden content
        run: python tooling/check_secrets.py --history --no-private-values
